name: Release

# Push a tag like v0.1.0 to build the Windows installer and the Android APK
# and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles nsis
      # A fixed file name lets the website link to releases/latest/download/<name>.
      - name: Rename installer
        shell: bash
        run: mv target/release/bundle/nsis/*.exe target/release/bundle/nsis/Echoport-Windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/Echoport-Windows-x64-setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Echoport-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/release/Echoport-Android.apk

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Echoport ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
